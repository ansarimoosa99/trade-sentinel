plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

// Override Flyway version — Spring Boot 3.3.5 ships 10.10 which doesn't support PG 17
ext['flyway.version'] = '10.22.0'

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // Core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'   // PG 17 dialect
    runtimeOnly 'org.postgresql:postgresql'

    // Observability
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // UI (Thymeleaf dashboard)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Notifications
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Rate limiting
    implementation 'com.google.guava:guava:33.2.1-jre'

    // Lombok — removes entity boilerplate
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.assertj:assertj-core'
}

test {
    useJUnitPlatform()
}
